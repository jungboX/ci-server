name: Node.js CI/CD

on:
  push:
    branches: [ master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.version }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Generate version
      id: version
      run: |
        echo "version=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Build and push Docker image 
      run: |
        # buildx 설정
        docker buildx create --name mybuilder --use
        docker buildx inspect --bootstrap
        
        # 단일 플랫폼 빌드 및 푸시(linux/amd64만 지정)
        docker buildx build \
          --platform linux/amd64 \
          -t 542468166994.dkr.ecr.ap-northeast-2.amazonaws.com/sample-server:v2 \
          --push .

    - name: Deploy container to EC2
      env:
        EC2_HOST: ${{ secrets.EC2_PUBLIC_IP }}
        EC2_USER: ec2-user
        SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_KEY }}
        AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: |
        # 1. SSH 키 설정
        echo "$SSH_PRIVATE_KEY" > ssh_key.pem
        chmod 600 ssh_key.pem

        # 2. EC2에서 실행할 단일 명령어 작성 (따옴표 에러 방지)
        COMMANDS="
        export AWS_ACCESS_KEY_ID=\"$AWS_KEY\"
        export AWS_SECRET_ACCESS_KEY=\"$AWS_SECRET\"
        export AWS_DEFAULT_REGION=\"$AWS_REGION\"

        aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin 542468166994.dkr.ecr.$AWS_REGION.amazonaws.com
        docker pull 542468166994.dkr.ecr.$AWS_REGION.amazonaws.com/sample-server:v2
        docker stop sample-server 2>/dev/null || true
        docker rm sample-server 2>/dev/null || true
        docker run -d --name sample-server --restart always -p 3000:3000 542468166994.dkr.ecr.$AWS_REGION.amazonaws.com/sample-server:v2
        "

        # 3. 원격 실행
        ssh -o StrictHostKeyChecking=no -i ssh_key.pem ${EC2_USER}@${EC2_HOST} "$COMMANDS"

        # 4. 키 정리
        rm -f ssh_key.pem