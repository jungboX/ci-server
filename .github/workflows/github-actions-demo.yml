name: Node.js CI/CD

on:
  push:
    branches: [ master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.version }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Generate version
      id: version
      run: |
        echo "version=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Build and push Docker image 
      run: |
        # buildx 설정
        docker buildx create --name mybuilder --use
        docker buildx inspect --bootstrap
        
        # 단일 플랫폼 빌드 및 푸시(linux/amd64만 지정)
        docker buildx build \
          --platform linux/amd64 \
          -t 542468166994.dkr.ecr.ap-northeast-2.amazonaws.com/sample-server:v2 \
          --push .

    - name: Deploy container to EC2
      env:
        EC2_HOST: ${{ secrets.EC2_PUBLIC_IP }}
        EC2_USER: ec2-user
        SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_KEY }}
      run: |
        # SSH 키 설정
        echo "$SSH_PRIVATE_KEY" > private_key.pem
        chmod 600 ssh_key.pem
        
        # EC2에 접속하여 컨테이너 업데이트 실행
        ssh -o StrictHostKeyChecking=no -i ssh_key.pem ${EC2_USER}@${EC2_HOST} '
          # ECR 로그인
          aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 542468166994.dkr.ecr.ap-northeast-2.amazonaws.com

          # 최신 이미지 풀 
          docker pull 542468166994.dkr.ecr.ap-northeast-2.amazonaws.com/sample-server:latest

          # 기존 컨테이너 중지 및 제거
          docker stop sample-server || true
          docker rm sample-server || true

          # 새 컨테이너 실행
          docker run -d --name sample-server --restart always -p 3000:3000 542468166994.dkr.ecr.ap-northeast-2.amazonaws.com/sample-server:v2
        '

        # 임시 SSH 키 파일 제거
        rm ssh_key.pem